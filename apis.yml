aid: sigfox
name: Sigfox
description: >-
  Sigfox is the 0G low-power wide-area network (LPWAN) for massive IoT, now
  operated as a technology by UnaBiz. The Sigfox Cloud exposes a RESTful backend
  API (base https://api.sigfox.com/v2) for managing devices, device types,
  contracts, groups, users, base stations, coverage predictions, and for
  retrieving device messages and configuring callbacks that push uplink data to
  customer systems. The network reaches 70+ countries and millions of connected
  devices. The API uses HTTP Basic authentication with API-access credentials
  scoped by role-based profiles, URI-path versioning (/v2), documented rate
  limits, and a published OpenAPI specification.
