versioning:
  scheme: uri-path
  current: v2
  docs: https://support.sigfox.com/docs/api-versioning
  notes: >-
    Versions are exposed as a "vX" suffix in the endpoint path (e.g.
    api.sigfox.com/v2/devices). Every request must include the version suffix.
    Backwards-compatible changes (new interfaces/bindings, optional request
    fields, added response fields, added enum values) ship within the current
    major version; backwards-incompatible changes (removing/renaming
    interfaces/fields/enum values, changing HTTP bindings or field types,
    altering visible behavior, adding mandatory request fields) are reserved
    for the next major version.
