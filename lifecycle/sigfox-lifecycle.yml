  policy_url: https://support.sigfox.com/docs/api-versioning
  sunset_header: false
  notes: >-
    Breaking changes are only introduced in a new major version; minor/patch
    changes remain backward compatible. News and changes are published on the
    Sigfox Portal, and users can subscribe to release emails via their user
    profile.
